services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://host.docker.internal:5432/smartfinances
      DB_USERNAME: lucky
      DB_PASSWORD: ""
      JWT_SECRET: local-dev-secret-change-in-production
      JWT_EXPIRATION: 900
      JWT_REFRESH_EXPIRATION: 604800

